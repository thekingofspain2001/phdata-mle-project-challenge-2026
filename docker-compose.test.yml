services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.14}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - test-network

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.14}
    depends_on:
      api:
        condition: service_healthy
    environment:
      - COVERAGE_FILE=/tmp/.coverage
      - API_BASE_URL=http://api:8000
    # Run as the host user so files written into the test-results bind mount stay
    # owned by you instead of root. Export UID/GID first if your ids are not 1000.
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./test-results:/app/test-results
      - ./test:/app/test:ro
      - ./src:/app/src:ro
    command: pytest test/integration -v
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
