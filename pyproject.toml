[project]
name = "phdata-mle-project"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "pandas",
    "scikit-learn",
    "pydantic",
    "numpy",
    "structlog>=26.1.0",
    "asgi-correlation-id>=5.0.1",
]



[dependency-groups]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "httpx2>=2.0.0",
    "hypothesis>=6.82.0",
    "pyright>=1.1.390",
    "pandas-stubs>=2.2",
    "scipy-stubs==1.18.1.1",
    "scikit-learn-stubs==0.0.3",
]

# Notebook-only. Imported by notebooks/*.ipynb, never by src/, so keeping
# them in [project.dependencies] would ship matplotlib, pillow and the
# jupyter stack inside the API image (Dockerfile:12 sync --no-dev).
notebook = [
    "matplotlib",
    "seaborn",
]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short --cov=src --cov-report=term --cov-report=html:test-results/coverage"
pythonpath = [".", "src"]
markers = [
    "unit: Unit tests using TestClient",
    "integration: Integration tests requiring running API",
    "slow: Tests that take significant time",
]

[tool.coverage.run]
# The training script runs in its own image (src/model/Dockerfile), not in the
# API process, so it reads as 0% here. It is exercised by `docker run
# create-model` instead.
omit = ["src/model/create_model.py"]

[tool.coverage.report]
show_missing = true
# Current total is 84% with create_model.py omitted. Gate just under that so a
# real regression fails and ordinary additions do not.
fail_under = 80
