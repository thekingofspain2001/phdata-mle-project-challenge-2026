name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked --group test
      - run: uv run --group test pytest test/unit -q -p no:cacheprovider
      - run: uvx ruff@0.16.10 check .
      - run: uv run --group test pyright

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: test-results/coverage
          retention-days: 7

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --build-arg PYTHON_VERSION=$(cat .python-version) -f Dockerfile -t ml-api:ci .
      - run: docker build --build-arg PYTHON_VERSION=$(cat .python-version) -f Dockerfile.test -t ml-api-test:ci .
      - run: docker run --rm -v "$PWD/test-results:/app/test-results" ml-api-test:ci pytest test/unit -q -p no:cacheprovider
